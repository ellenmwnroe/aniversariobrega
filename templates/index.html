{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card p-4">
            <h1 class="text-center mb-4">🎉 breguinha da elle 🎂</h1>
            <p class="text-center mb-4"> confirma sua presença até <strong>01/05</strong>!</p>
            
            <!-- FORMULÁRIO COMPLETO -->
            <form method="POST" action="/confirmar">
                <!-- Nome -->
                <div class="mb-3">
                    <label for="nome" class="form-label">teu nome</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>
                
                <!-- telefone -->
                <div class="mb-3">
                    <label for="tel" class="form-label">teu telefone</label>
                    <input type="tel" class="form-control" id="telefone" name="telefone" required>
                </div>
                
            
                <div class="mb-4">
                    <label class="form-label">você vaiii? <span class="text-danger">*</span></label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="presenca" id="vou" value="sim" required>
                        <label class="form-check-label" for="vou">
                            ✅ simmm, eu vou!
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="presenca" id="nao_vou" value="nao">
                        <label class="form-check-label" for="nao_vou">
                            ❌ não vou e sou fedido
                        </label>
                    </div>
                </div>
                
                <!-- Mensagem adicional -->
                <div class="mb-3">
                    <label for="mensagem" class="form-label">deixe uma mensagem XD, e também se quiser chamar algum acompanhante bota aqui (opcional)</label>
                    <textarea class="form-control" id="mensagem" name="mensagem" rows="2"></textarea>
                </div>
                
                <!-- Botão de Envio -->
                <button type="submit" class="btn btn-confirm btn-lg w-100 text-white">Enviar Resposta</button>
            </form>
            <!-- FIM DO FORMULÁRIO -->
             <p class="text-center mt-4" class="btn btn-sm btn-outline-secondary"> ellen websites produções feito com python</a></p>
        </div>
    </div>
</div>
{% endblock %}
